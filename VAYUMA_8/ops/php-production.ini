expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Africa/Nairobi
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; Enforce password-change session revocation before every PHP entry point.
auto_prepend_file = /var/www/html/vayuma/includes/auth_session_guard.php
